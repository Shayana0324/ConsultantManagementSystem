spring.application.name=ConsultantManagementSystem
# ==========================================================
# Application
# ==========================================================
server.port=8080

# ==========================================================
# MySQL connection
# Change "root" / "your_password" to match your local MySQL setup.
# The database "consultant_db" must exist first -- see sql/schema.sql
# ==========================================================
spring.datasource.url=jdbc:mysql://localhost:3306/consultant_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=your_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==========================================================
# JPA / Hibernate
# "update" = Hibernate will create/alter the consultants table automatically
# based on the Consultant entity, so you do NOT have to run schema.sql by hand
# (it's provided too, in case you want to create the schema manually).
# ==========================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ==========================================================
# Thymeleaf (disable caching so template edits show up instantly in dev)
# ==========================================================
spring.thymeleaf.cache=false

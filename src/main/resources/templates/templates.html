<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Consultant Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <h2 class="mb-4">Dashboard</h2>

    <div class="row g-3 mb-4">
        <div class="col-md-4">
            <div class="card text-white bg-primary shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Total Consultants</h6>
                    <p class="display-6 mb-0" th:text="${totalConsultants}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-success shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Active Consultants</h6>
                    <p class="display-6 mb-0" th:text="${activeConsultants}">0</p>
                </div>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card text-white bg-secondary shadow-sm">
                <div class="card-body">
                    <h6 class="card-title">Inactive Consultants</h6>
                    <p class="display-6 mb-0" th:text="${inactiveConsultants}">0</p>
                </div>
            </div>
        </div>
    </div>

    <h5>Latest Consultants</h5>
    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Technology</th>
                <th>Experience (Years)</th>
                <th>Status</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${latestConsultants}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.name}">Name</td>
                <td th:text="${c.email}">Email</td>
                <td th:text="${c.technology}">Tech</td>
                <td th:text="${c.experience}">0</td>
                <td>
                    <span class="badge" th:classappend="${c.status == 'Active'} ? 'bg-success' : 'bg-secondary'"
                          th:text="${c.status}">Active</span>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(latestConsultants)}">
                <td colspan="6" class="text-center text-muted">No consultants yet. Add your first one!</td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/consultants}" class="btn btn-primary">View All Consultants</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

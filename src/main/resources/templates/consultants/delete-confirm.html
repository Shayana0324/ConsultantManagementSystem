<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Delete Consultant</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="card shadow-sm mx-auto text-center" style="max-width: 500px;">
        <div class="card-header bg-danger text-white">
            <h5 class="mb-0">Delete Consultant</h5>
        </div>
        <div class="card-body">
            <p class="fs-5">Are you sure you want to delete <strong th:text="${consultant.name}">this consultant</strong>?</p>
            <p class="text-muted">This action cannot be undone.</p>

            <form th:action="@{/consultants/delete/{id}(id=${consultant.id})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-danger">Yes, Delete</button>
            </form>
            <a th:href="@{/consultants}" class="btn btn-outline-secondary">Cancel</a>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>All Consultants - Consultant Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>All Consultants</h2>
        <a th:href="@{/consultants/add}" class="btn btn-success">+ Add Consultant</a>
    </div>

    <!-- Search by name or technology -->
    <form th:action="@{/consultants}" method="get" class="row g-2 mb-3">
        <div class="col-auto">
            <input type="text" name="keyword" th:value="${keyword}"
                   class="form-control" placeholder="Search by name or technology">
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-primary">Search</button>
        </div>
        <div class="col-auto" th:if="${not #strings.isEmpty(keyword)}">
            <a th:href="@{/consultants}" class="btn btn-outline-secondary">Clear</a>
        </div>
    </form>

    <div th:if="${param.deleted}" class="alert alert-success">Consultant deleted successfully.</div>
    <div th:if="${param.saved}" class="alert alert-success">Consultant saved successfully.</div>

    <div class="table-responsive">
        <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>
                    <a class="text-white text-decoration-none"
                       th:href="@{/consultants(keyword=${keyword}, sortField='name', sortDir=${sortField == 'name'} ? ${reverseSortDir} : 'asc')}">
                        Name
                    </a>
                </th>
                <th>Email</th>
                <th>Phone</th>
                <th>
                    <a class="text-white text-decoration-none"
                       th:href="@{/consultants(keyword=${keyword}, sortField='technology', sortDir=${sortField == 'technology'} ? ${reverseSortDir} : 'asc')}">
                        Technology
                    </a>
                </th>
                <th>
                    <a class="text-white text-decoration-none"
                       th:href="@{/consultants(keyword=${keyword}, sortField='experience', sortDir=${sortField == 'experience'} ? ${reverseSortDir} : 'asc')}">
                        Experience (Years)
                    </a>
                </th>
                <th>Status</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${consultants}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.name}">Name</td>
                <td th:text="${c.email}">Email</td>
                <td th:text="${c.phone}">Phone</td>
                <td th:text="${c.technology}">Tech</td>
                <td th:text="${c.experience}">0</td>
                <td>
                    <span class="badge" th:classappend="${c.status == 'Active'} ? 'bg-success' : 'bg-secondary'"
                          th:text="${c.status}">Active</span>
                </td>
                <td>
                    <a th:href="@{/consultants/edit/{id}(id=${c.id})}" class="btn btn-sm btn-warning">Edit</a>
                    <a th:href="@{/consultants/delete/{id}/confirm(id=${c.id})}" class="btn btn-sm btn-danger">Delete</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(consultants)}">
                <td colspan="8" class="text-center text-muted">No consultants found.</td>
            </tr>
            </tbody>
        </table>
    </div>

    <!-- Pagination -->
    <nav th:if="${totalPages > 1}">
        <ul class="pagination">
            <li class="page-item" th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:href="@{/consultants(keyword=${keyword}, page=${i}, sortField=${sortField}, sortDir=${sortDir})}"
                   th:text="${i + 1}">1</a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
